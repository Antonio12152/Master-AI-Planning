app = "master-ai-planning"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  INERTIA_SSR_ENABLED = "false"
  DB_CONNECTION = "pgsql"
  CACHE_DRIVER = "array"
  SESSION_DRIVER = "array"
  QUEUE_CONNECTION = "database"
  PORT = "8080"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
