# fly.toml app configuration file generated for master-ai-planning on 2026-07-13T15:25:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'master-ai-planning'
primary_region = 'iad'

[experimental]

[build]
  image = 'Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  APP_URL = 'https://master-ai-planning.fly.dev'
  CACHE_DRIVER = 'array'
  DB_CONNECTION = 'pgsql'
  QUEUE_CONNECTION = 'database'
  SESSION_DRIVER = 'array'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
